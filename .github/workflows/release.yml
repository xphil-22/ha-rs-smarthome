name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the ZIP for"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set manifest version from tag
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/rs_smarthome/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/rs_smarthome/manifest.json

      - name: Build ZIP
        run: |
          cd custom_components/rs_smarthome
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -r "$GITHUB_WORKSPACE/rs_smarthome.zip" .

      - name: Upload to release
        run: gh release upload "$TAG" rs_smarthome.zip --clobber
